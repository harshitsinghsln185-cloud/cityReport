  <!-- Brand Typography -->
  <text x="215" y="160" font-family="'Fraunces Variable', Georgia, serif" font-size="54" font-weight="600" fill="#FFFFFF" letter-spacing="-1">Crowd <tspan fill="#E8A33D">Report</tspan></text>
  <text x="217" y="195" font-family="'Manrope Variable', sans-serif" font-size="16" font-weight="700" fill="#E8A33D" letter-spacing="3">DECENTRALIZED CIVIC INFRASTRUCTURE PLATFORM</text>

  <!-- Main Value Proposition Headline -->
  <text x="100" y="320" font-family="'Fraunces Variable', Georgia, serif" font-size="52" font-weight="700" fill="#FFFFFF" letter-spacing="-1.5">
    India's Unified Civic Accountability
  </text>
  <text x="100" y="380" font-family="'Fraunces Variable', Georgia, serif" font-size="52" font-weight="700" fill="#C8A24A" letter-spacing="-1.5">
    &amp; Public Redressal Network.
  </text>

  <!-- Subtitle -->
  <text x="100" y="440" font-family="'Manrope Variable', sans-serif" font-size="22" font-weight="400" fill="#94A3B8" letter-spacing="-0.2">
    Empowering citizens to report municipal hazards, lock verified escrow, and enforce 48h SLA resolution.
  </text>

  <!-- Trust Badges (Horizontal Row at bottom) -->
  <g transform="translate(100, 495)">
    <!-- Badge 1: 36 States -->
    <rect x="0" y="0" width="280" height="52" rx="12" fill="#12306A" stroke="#244B8E" stroke-width="1"/>
    <circle cx="26" cy="26" r="6" fill="#C8A24A"/>
    <text x="44" y="32" font-family="'Manrope Variable', sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">36 States &amp; Union Territories</text>

    <!-- Badge 2: Escrow Exact -->
    <rect x="305" y="0" width="280" height="52" rx="12" fill="#12306A" stroke="#244B8E" stroke-width="1"/>
    <circle cx="331" cy="26" r="6" fill="#0E6E4C"/>
    <text x="349" y="32" font-family="'Manrope Variable', sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">Integer Paise Escrow Lock</text>

    <!-- Badge 3: Geo-Proof SLA -->
    <rect x="610" y="0" width="280" height="52" rx="12" fill="#12306A" stroke="#244B8E" stroke-width="1"/>
    <circle cx="636" cy="26" r="6" fill="#C8A24A"/>
    <text x="654" y="32" font-family="'Manrope Variable', sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">Geo-Tagged Photo Proof</text>
  </g>
